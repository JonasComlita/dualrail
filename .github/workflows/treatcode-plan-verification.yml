name: TreatCode plan verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run TreatCode verifier unit tests
        run: python -m unittest tools.tests.test_treatcode_plan_verifier

      - name: Validate TreatCode plan manifest and index
        run: python tools/trit_tool.py website plans validate --json

      - name: Verify P00 and retain pre-completion evidence
        id: verify-p00
        continue-on-error: true
        run: python tools/trit_tool.py website plan verify P00 --json

      - name: Upload TreatCode verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treatcode-plan-verification-${{ github.sha }}
          path: build/treatcode-plan-evidence/
          if-no-files-found: error
